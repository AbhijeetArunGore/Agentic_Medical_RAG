[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-medical-rag"
version = "1.0.0"
description = "Production-grade Clinical Decision Support System built with LangGraph, ChromaDB, and FastAPI."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Abhijeet Gore", email = "abhijeet.gore@example.com"}
]
dependencies = [
    "langchain>=0.3.0",
    "langgraph>=0.2.0",
    "chromadb>=0.5.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "streamlit>=1.40.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["data*", "notebooks*", "evaluation*", "tests*", "benchmarks*", "vector_db*"]

[tool.black]
line-length = 100
target-version = ['py310', 'py311']

[tool.isort]
profile = "black"
line_length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short -p no:typeguard"
pythonpath = ["."]
markers = [
    "unit: Pure unit tests with zero external service dependencies",
    "integration: Multi-component integration tests",
    "api: FastAPI REST API route tests",
    "safety: Clinical safety, prompt injection, and contraindication tests",
    "slow: Tests with longer execution times",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]
