name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Production & Dev Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run Black Code Format Check
        run: |
          black --check app tests main.py

      - name: Run Flake8 Linting
        run: |
          flake8 app tests --count --max-complexity=10 --max-line-length=120 --extend-ignore=E402,W293,E501 --statistics

      - name: Run Pytest Test Suite
        run: |
          pytest tests/ -v
