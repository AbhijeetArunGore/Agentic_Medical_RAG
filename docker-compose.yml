version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agentic_medical_rag_api
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - MOCK_LLM=true
      - LOG_LEVEL=INFO
      - VECTOR_DB_PATH=/app/vector_db
      - API_HOST=0.0.0.0
      - API_PORT=8000
    volumes:
      - medical_vector_data:/app/vector_db
      - ./data:/app/data:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agentic_medical_rag_dashboard
    command: streamlit run app/dashboard.py --server.port=8501 --server.address=0.0.0.0
    ports:
      - "8501:8501"
    environment:
      - ENVIRONMENT=production
      - MOCK_LLM=true
      - LOG_LEVEL=INFO
      - VECTOR_DB_PATH=/app/vector_db
    volumes:
      - medical_vector_data:/app/vector_db
      - ./data:/app/data:ro
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  medical_vector_data:
    driver: local
